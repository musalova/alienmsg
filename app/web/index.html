<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AlienMsg — messaggi cifrati end-to-end, offline, copy-paste.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AlienMsg">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#1A1030">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AlienMsg</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Load the Rust crypto core (WASM) before Flutter boots: the module
    instantiates pkg/alien_ffi_bg.wasm and exposes window.alienInvoke(json)
    used by ffi_transport_web.dart. window.alienReady resolves when usable.
  -->
  <script type="module">
    import init, { alienInvokeJson } from './pkg/alien_ffi.js';
    window.alienReady = init().then(() => {
      window.alienInvoke = (req) => alienInvokeJson(req);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
