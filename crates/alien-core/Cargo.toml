[package]
name = "alien-core"
version = "0.1.0"
edition = "2021"
description = "Core cryptographic engine for AlienMsg: hybrid PQ handshake, Double Ratchet, group sender-keys"

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
ml-kem = "0.2"
kem = "=0.3.0-pre.0"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
bip39 = { version = "2", features = ["rand", "italian"] }
thiserror = "2"
base64 = "0.22"
