[package]
name = "alien-store"
version = "0.1.0"
edition = "2021"
description = "Encrypted at-rest vault for identity, sessions and group state"

[dependencies]
alien-core = { path = "../alien-core" }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Storage", "Window"] }
base64 = "0.22"
