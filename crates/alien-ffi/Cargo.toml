[package]
name = "alien-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI bridge (JSON in/out) consumed by the Flutter app via dart:ffi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alien-core = { path = "../alien-core" }
alien-codec = { path = "../alien-codec" }
alien-store = { path = "../alien-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
